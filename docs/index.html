<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кросплатформне програмування — PostProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@500&family=Google+Sans:wght@600&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="header-content">
          <h1>Кросплатформене програмування</h1>
          <p class="header-subtitle">Списки + документація лабораторних робіт</p>
        </div>
      </header>

      <main class="app-main">
        <section class="card-wrapper app-description">
          <h2>Лабораторні роботи з кросплатформного програмування</h2>
          <p class="description">
            Усі роботи розвивають один застосунок поштової логістики PostProject:
            від клієнтської частини до REST і GraphQL API.
          </p>
        </section>

        <div id="labs" style="display: contents"></div>
      </main>

      <footer class="app-footer">
      </footer>
    </div>

    <script src="labs.js"></script>
  </body>
</html>
